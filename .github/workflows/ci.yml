name: CI

# 每次推到 main 或提 PR 都跑：格式、静态检查、跨平台编译与测试。
# 目标是把「记得本地跑一遍」变成机器替你记——0.4.0 之前这些全靠手工。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件没有按 gofmt 格式化："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          # 按目标平台（Windows）检查：Linux 下 Windows 专用文件会被排除，
          # 那些「只在 Windows 代码里被引用」的符号会被误报成 U1000。
          GOOS=windows GOARCH=amd64 staticcheck ./...

      - name: 交叉编译（Windows / Linux）
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=amd64 go build ./...

  test:
    name: 测试（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Windows 是目标平台：窗口/注册表/证书相关的测试只在这里跑得到。
      # 失败摘要同样写成 annotation，方便公开仓库排障。
      - name: go test（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "go-test-windows.log"
          go test ./... -count=1 -timeout 20m 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $summary = Select-String -Path $log -Pattern '^--- FAIL|^FAIL|^panic:|WARNING: DATA RACE|^\s+\S+_test\.go:\d+:|^\s+tongtu/' |
              Select-Object -First 10 | ForEach-Object { $_.Line }
            if (-not $summary) { $summary = Get-Content $log -Tail 10 }
            $summary | ForEach-Object {
              Write-Host $_
              Write-Host "::error title=Windows 测试失败::$_"
            }
            exit $status
          }

      # Linux 上跑 -race：竞态检测不需要真的 Windows，能覆盖大部分核心包。
      # 失败时把关键行写成 annotation：公开仓库的 Actions 日志要登录才能下载，
      # annotation 则可以匿名读取，排障时不用让人帮忙翻日志。
      - name: go test -race（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # GitHub 默认给 bash 加了 -e：go test 失败会直接退出脚本，
          # 后面的失败摘要就永远执行不到。用 `|| status=$?` 接住退出码。
          status=0
          go test -race ./... -count=1 -timeout 20m 2>&1 | tee /tmp/go-test.log || status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== 失败摘要 ====="
            summary=$(grep -E '^(--- FAIL|FAIL|panic:)|WARNING: DATA RACE|Found [0-9]+ data race|^[[:space:]]+[^[:space:]]+_test\.go:[0-9]+:|^[[:space:]]+tongtu/' /tmp/go-test.log | head -n 10 || true)
            if [ -z "$summary" ]; then
              summary=$(tail -n 10 /tmp/go-test.log || true)
            fi
            printf '%s\n' "$summary"
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::error title=Linux 测试失败::$line"
              fi
            done <<< "$summary"
            exit "$status"
          fi
